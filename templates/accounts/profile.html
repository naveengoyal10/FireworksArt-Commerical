{% extends 'base.html' %}
{% block content %}
<h2>Profile</h2>
<p><strong>Name:</strong> {{ user.get_full_name }}</p>
<p><strong>Email:</strong> {{ user.email }}</p>
<p><strong>Phone:</strong> {{ user.profile.phone }}</p>
<p><a class="btn btn-secondary" href="{% url 'accounts_edit_profile' %}">Edit Profile</a></p>
<h3>Addresses</h3>
<p><a class="btn btn-primary" href="{% url 'accounts_address_list' %}">Manage Addresses</a></p>
{% endblock %}
